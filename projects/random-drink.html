<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Drink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Montserrat", sans-serif;
        }

        /* Single row, two columns, filling the screen below the 10vh header */
        .plannerLayout {
            display: flex;
            flex-direction: row;
            height: 90vh;
            margin-top: 10vh;
        }

        .recipeIntro {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .ingredientColumn {
            flex: 0 0 33.333%;
            overflow-y: auto;
            padding: 20px;
            background-color: rgb(30, 30, 30);
            border-right: 1px solid rgb(70, 70, 70);
        }

        .recipeColumn {
            flex: 1 1 0;
            min-width: 0;
            overflow-y: auto;
            padding: 20px;
        }

        .columnTitle {
            margin: 0 0 16px;
            font-size: clamp(18px, 2vw, 28px);
            font-weight: 700;
        }

        /* Ingredient checklist */
        #ingredientList {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #ingredientList label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        #ingredientList label:hover {
            background-color: rgb(50, 50, 50);
        }

        #ingredientList input[type="checkbox"] {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            cursor: pointer;
        }

        /* Recipe grid */
        #recipeGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .recipeGridButton {
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            background-color: #fff;
            color: #2d2d2d;
            font-family: inherit;
            font-size: clamp(13px, 1.3vw, 17px);
            font-weight: 700;
            line-height: 1.3;
            text-align: left;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .recipeGridButton:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
        }

        .recipeGridButton img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }

        .recipeGridButton span {
            padding: 12px 14px 16px;
        }

        /* Single recipe view */
        #recipeView[hidden], #recipeGrid[hidden], .recipeIntro[hidden],
        .recipeGridButton[hidden], #filterMessage[hidden] {
            display: none;
        }

        #filterMessage {
            margin: 0 0 12px;
            color: rgb(200, 200, 200);
        }

        .extrasToggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px 6px;
            font-size: 0.9em;
            color: rgb(200, 200, 200);
            cursor: pointer;
        }

        #clearIngredients {
            margin-bottom: 12px;
            padding: 0.5em 1.2em;
            font-size: 0.9em;
            font-weight: 600;
            background-color: #595959;
            color: white;
            border: 2px solid rgb(127, 127, 127);
            border-radius: 9999px;
            cursor: pointer;
        }

        .extrasToggle input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .recipeIngredientSection {
            margin-top: 20px;
        }

        .recipeSectionTitle {
            margin: 0 0 10px;
            font-size: clamp(16px, 1.6vw, 22px);
        }

        .recipeHeaderImage {
            display: block;
            width: 100%;
            max-height: 40vh;
            object-fit: cover;
            border-radius: 8px;
        }

        .recipeInfoLine {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 24px;
            margin: 16px 0 24px;
        }

        .recipeInfoName {
            font-size: clamp(20px, 2.4vw, 32px);
            font-weight: 700;
        }

        .recipeInfoDescription, .recipeInfoGlass {
            color: rgb(200, 200, 200);
        }

        .recipeIngredientGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .recipeIngredientCell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px;
            text-align: center;
            background-color: rgb(30, 30, 30);
            border-radius: 8px;
        }

        .recipeIngredientCell img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }

        .recipeIngredientAmount {
            font-size: 0.85em;
            color: rgb(170, 170, 170);
        }

        .recipeInstructions {
            margin-top: 24px;
        }

        .recipeInstructions p {
            margin: 0 0 8px;
            line-height: 1.5;
        }

        .recipeBackButton {
            margin-top: 24px;
            padding: 12px 20px;
            font-family: inherit;
            font-weight: 700;
            color: #2d2d2d;
            background-color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Stack on narrow screens */
        @media (max-width: 700px) {
            .plannerLayout {
                flex-direction: column;
                height: auto;
            }
            .ingredientColumn {
                flex: none;
                max-height: 40vh;
                border-right: none;
                border-bottom: 1px solid rgb(70, 70, 70);
            }
            .recipeColumn {
                overflow-y: visible;
            }
        }
    </style>
</head>
<body>
    <div class="mainContent">

        <div class="header">
            <ul>
                <li><button class="navigationButton" id="homeButton">HOME</button></li>
            </ul>
        </div>

        <div class="mobileHeader">
            <div class="alwaysOnMobileButtonsListDiv">
                <ul class="alwaysOnMobileButtonsList">
                    <li><button class="navigationButton" id="homeButtonMobile">HOME</button></li>
                    <!-- <li><button class="navigationButton" id="animationButtonMobile">PROJECTS</button></li>
                    <li><button class="navigationButton" id="photographyButtonMobile">PHOTOGRAPHY</button></li> -->
                </ul>
                <button id="hamburgerButton">☰</button>
            </div>

            <div class="mobileButtonsListDiv">
                <ul class="mobileButtonsList">
                    <!-- <li><button class="navigationButton" id="blogButtonMobile">BLOG</button></li>
                    <li><button class="navigationButton" id="contactButtonMobile">CONTACT</button></li>
                    <li><button class="navigationButton" id="aboutButtonMobile">ABOUT</button></li> -->
                </ul>
            </div>
        </div>

        <div class="plannerLayout">
            <section class="ingredientColumn">
                <h2 class="columnTitle">Ingredients</h2>
                <label class="extrasToggle">
                    <input type="checkbox" id="ignoreExtras" checked>
                    <span>Ignore garnishes, ice, water, etc.</span>
                </label>
                <button id="clearIngredients">Clear all</button>
                <ul id="ingredientList"></ul>
            </section>

            <section class="recipeColumn">
                <div class="recipeIntro">
                    <div id="recipePageTitle">
                        <span>What's For Drinks?</span>
                    </div>

                    <div id="recipePageDescription">
                        <span>
                            Not sure what to drink?
                            Click the button below to randomly pick from a library of drinks. Use the
                            ingredient checklist to filter the results to only show drinks that you can make with what you have on hand.
                        </span>
                    </div>

                    <div id="randomButtonWrapper">
                        <button id="randomButton">Shuffle</button>
                    </div>
                </div>

                <p id="filterMessage"></p>

                <div id="recipeGrid"></div>

                <div id="recipeView" hidden></div>
            </section>
        </div>

    </div>
    <script type="module" src="script-random-drink.js"></script>
</body>
</html>
